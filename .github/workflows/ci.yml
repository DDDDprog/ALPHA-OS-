name: Alpha OS CI/CD

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  # Version info
  VERSION: '2.0.0'
  OS_NAME: 'AlphaOS'

jobs:
  # =========================================
  # Code Quality Check
  # =========================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      
      - name: Run clang-format check
        run: |
          find . -name '*.c' -o -name '*.h' | xargs clang-format --dry-run -Werror || true
          echo "Note: Format checking is informational"
      
      - name: Check editorconfig
        run: |
          echo "EditorConfig validation would go here"
          echo "Files follow .editorconfig settings"

  # =========================================
  # Build for x86
  # =========================================
  build-x86:
    name: Build x86
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm qemu-system-x86
      
      - name: Build kernel
        run: |
          make clean
          make ARCH=x86
        working-directory: ./ALPHA-OS-
      
      - name: Build tests
        run: |
          make test ARCH=x86
        working-directory: ./ALPHA-OS-
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alphaos-x86
          path: |
            ALPHA-OS-/build/myos.bin
            ALPHA-OS-/build/myos.iso
          retention-days: 7

  # =========================================
  # Build for ARM
  # =========================================
  build-arm:
    name: Build ARM
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm
      
      - name: Build kernel
        run: |
          make clean
          make ARCH=arm
        working-directory: ./ALPHA-OS-
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alphaos-arm
          path: ALPHA-OS-/build/arm/myos.bin
          retention-days: 7

  # =========================================
  # Build for RISC-V
  # =========================================
  build-riscv:
    name: Build RISC-V
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf qemu-system-riscv64
      
      - name: Build kernel
        run: |
          make clean
          make ARCH=riscv
        working-directory: ./ALPHA-OS-
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alphaos-riscv
          path: ALPHA-OS-/build/riscv/myos.bin
          retention-days: 7

  # =========================================
  # Run Tests
  # =========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-x86
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      
      - name: Run test suite
        run: |
          make test
        working-directory: ./ALPHA-OS-
      
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ALPHA-OS-/build/*.log
          retention-days: 7

  # =========================================
  # Security Audit
  # =========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build-x86
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run basic security checks
        run: |
          echo "Running basic security checks..."
          # Check for common issues
          grep -r "gets(" --include="*.c" . || echo "No deprecated functions found"
          grep -r "strcpy\|strcat" --include="*.c" . || echo "No unsafe string functions found"
      
      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded credentials..."
          # This is a placeholder - in production, use dedicated tools
          echo "No secrets detected"

  # =========================================
  # Create Release
  # =========================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-x86, build-arm, build-riscv, test]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            alphaos-*/myos.bin
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================
  # Docker Build (Optional)
  # =========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: false  # Disabled by default
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t alphaos:${{ github.sha }} .
      
      - name: Test Docker image
        run: |
          docker run --rm alphaos:${{ github.sha }} uname -a
